        #piece-dropdown {

/* =========================================================
   CREATE EMPTY BOARD
========================================================= */

function createEmptyBoard() {

    setupBoard = [];

    for (let row = 0; row < boardSize; row++) {

        setupBoard[row] = [];

        for (let col = 0; col < boardSize; col++) {

            setupBoard[row][col] = null;

        }

    }

}


/* =========================================================
   NORMAL STARTING POSITION
========================================================= */

const officerRow = [
    'E', 'Ch', 'Af', 'Ab',
    'Ex', 'Ca', 'M', 'K',
    'A', 'J', 'Al', 'R',
    'ZN', 'Ba', 'Ch', 'E'
];

const pawnRow = [
    'BP', 'BP', 'BP', 'P',
    'P', 'P', 'AP', 'AP',
    'AP', 'AP', 'P', 'P',
    'P', 'BP', 'BP', 'BP'
];


function resetBoard() {

    createEmptyBoard();

    for (let col = 0; col < boardSize; col++) {

        setupBoard[0][col] = {
            type: officerRow[col],
            color: 'black'
        };

        setupBoard[15][col] = {
            type: officerRow[col],
            color: 'white'
        };

        setupBoard[1][col] = {
            type: pawnRow[col],
            color: 'black'
        };

        setupBoard[14][col] = {
            type: pawnRow[col],
            color: 'white'
        };

    }

    renderBoard();
    updateFEN();

}


/* =========================================================
   CREATE VISUAL BOARD
========================================================= */

function createBoardVisuals() {

    const board = document.getElementById('board');

    const letters = "abcdefghijklmnop";

    for (let row = 0; row < boardSize; row++) {

        for (let col = 0; col < boardSize; col++) {

            const square = document.createElement('div');

            square.className =
                `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;

            square.dataset.row = row;
            square.dataset.col = col;


            /* Coordinates */

            if (col === 0) {

                const number = document.createElement('span');

                number.className =
                    'coord-label coord-number';

                number.innerText =
                    boardSize - row;

                square.appendChild(number);

            }


            if (row === boardSize - 1) {

                const letter = document.createElement('span');

                letter.className =
                    'coord-label coord-letter';

                letter.innerText =
                    letters[col];

                square.appendChild(letter);

            }


            /* Left click */

            square.addEventListener('click', () => {

                placeSelectedPiece(row, col);

            });


            /* Right click */

            square.addEventListener('contextmenu', event => {

                event.preventDefault();

                setupBoard[row][col] = null;

                renderBoard();

                updateFEN();

            });


            board.appendChild(square);

        }

    }

}


/* =========================================================
   RENDER BOARD
========================================================= */

function renderBoard() {

    const squares =
        document.querySelectorAll('.square');

    squares.forEach(square => {

        const row =
            Number(square.dataset.row);

        const col =
            Number(square.dataset.col);

        const oldImage =
            square.querySelector('img');

        if (oldImage) {

            oldImage.remove();

        }


        const piece =
            setupBoard[row][col];

        if (!piece) return;


        const colorPrefix =
            piece.color === 'white'
                ? 'W'
                : 'B';


        const image =
            document.createElement('img');

        image.src =
            `pieces/${colorPrefix}_${piece.type}.png`;

        image.alt =
            `${piece.color} ${piece.type}`;

        square.appendChild(image);

    });

}


/* =========================================================
   PLACE SELECTED PIECE
========================================================= */

function placeSelectedPiece(row, col) {

    if (!selectedPiece) return;

    setupBoard[row][col] = {

        type: selectedPiece.type,

        color: selectedPiece.color

    };

    renderBoard();

    updateFEN();

}


/* =========================================================
   PIECE DROPDOWN
========================================================= */

const selectorHeader =
    document.getElementById('selector-header');

const dropdown =
    document.getElementById('piece-dropdown');

const dropdownArrow =
    document.getElementById('dropdown-arrow');


selectorHeader.addEventListener('click', () => {

    dropdown.classList.toggle('open');

    dropdownArrow.classList.toggle('open');

});


function createPieceDropdown() {

    dropdown.innerHTML = '';


    pieces.forEach(piece => {

        /* White */

        const whiteOption =
            document.createElement('div');

whiteOption.className =
    'piece-option';

whiteOption.dataset.pieceName =
    `White ${piece.name}`;

whiteOption.innerHTML = `
    <img src="${piece.white}">
    <span>White ${piece.name}</span>
`

        whiteOption.addEventListener('click', event => {

            event.stopPropagation();

            selectPiece(piece, 'white');

        });

        dropdown.appendChild(whiteOption);


        /* Black */

        const blackOption =
            document.createElement('div');

blackOption.className =
    'piece-option';

blackOption.dataset.pieceName =
    `Black ${piece.name}`;

blackOption.innerHTML = `
    <img src="${piece.black}">
    <span>Black ${piece.name}</span>
`;

        blackOption.addEventListener('click', event => {

            event.stopPropagation();

            selectPiece(piece, 'black');

        });

        dropdown.appendChild(blackOption);

    });

}
/* =========================================================
   KEYBOARD PIECE SEARCH
========================================================= */

let keyboardSearchLetter = '';
let keyboardSearchIndex = 0;
let keyboardSearchTimeout = null;

document.addEventListener('keydown', event => {
    if (!dropdown.classList.contains('open')) return;

    if (
        event.ctrlKey ||
        event.altKey ||
        event.metaKey
    ) {
        return;
    }

    const key = event.key.toLowerCase();

    if (!/^[a-z]$/.test(key)) return;

    event.preventDefault();

    if (keyboardSearchLetter !== key) {
        keyboardSearchLetter = key;
        keyboardSearchIndex = 0;
    } else {
        keyboardSearchIndex++;
    }

    clearTimeout(keyboardSearchTimeout);

    keyboardSearchTimeout = setTimeout(() => {
        keyboardSearchLetter = '';
        keyboardSearchIndex = 0;
    }, 1000);

    const matchingPieces = pieces.filter(piece =>
        piece.name.toLowerCase().startsWith(key)
    );

    if (matchingPieces.length === 0) return;

    keyboardSearchIndex =
        keyboardSearchIndex % matchingPieces.length;

    const targetPiece =
        matchingPieces[keyboardSearchIndex];

    const options =
        Array.from(
            dropdown.querySelectorAll('.piece-option')
        );

    const targetIndex =
        pieces.indexOf(targetPiece) * 2;

    options.forEach(option => {
        option.classList.remove('keyboard-highlight');
    });

    const targetOption = options[targetIndex];

    if (!targetOption) return;

    targetOption.classList.add('keyboard-highlight');

    targetOption.scrollIntoView({
        block: 'nearest',
        behavior: 'smooth'
    });
});

/* =========================================================
   SELECT PIECE
========================================================= */

function selectPiece(piece, color) {

    selectedPiece = {

        type: piece.type,

        color: color,

        image:
            color === 'white'
                ? piece.white
                : piece.black,

        name:
            `${color === 'white' ? 'White' : 'Black'} ${piece.name}`

    };


    const display =
        document.getElementById(
            'selected-piece-display'
        );


    display.innerHTML = `

        <img src="${selectedPiece.image}">

        <span>
            ${selectedPiece.name}
        </span>

    `;


    dropdown.classList.remove('open');

    dropdownArrow.classList.remove('open');

}

    if (!piece) return '';

    const map = {

        'K': 'K',

        'AfR': 'AfR',
        'Af': 'Af',
        'Al': 'Al',

        '0P': '0P',
        '0Q': '0Q',
        '0R': '0R',
        '0N': '0N',
        '0B': '0B'

    };


    let value =
        map[piece.type] || piece.type;


    if (piece.color === 'black') {

        value =
            value.toLowerCase();

    }


    return value;

}


/*
   IMPORTANT:

   This generates the board-position portion
   of your FEN.

   Each rank is separated by /.
*/

function generateFEN() {

    let ranks = [];


    for (let row = 0; row < boardSize; row++) {

        let rank = '';

        let emptyCount = 0;


        for (let col = 0; col < boardSize; col++) {

            const piece =
                setupBoard[row][col];


            if (!piece) {

                emptyCount++;

            } else {

                if (emptyCount > 0) {

                    rank += emptyCount;

                    emptyCount = 0;

                }

                rank += pieceToFEN(piece);

            }

        }


        if (emptyCount > 0) {

            rank += emptyCount;

        }


        ranks.push(rank);

    }


return ranks.join('/') + ' ' + activeSide;

}


/* =========================================================
   UPDATE FEN BOX
========================================================= */

function updateFEN() {

    document.getElementById('fen-textbox').value =
        generateFEN();

}


/* =========================================================
   COPY FEN
========================================================= */

document
    .getElementById('copy-fen')
    .addEventListener('click', async () => {

        const fen =
            document.getElementById('fen-textbox').value;


        try {

            await navigator.clipboard.writeText(fen);

            const button =
                document.getElementById('copy-fen');

            const oldText =
                button.innerText;

            button.innerText =
                'COPIED!';

            setTimeout(() => {

                button.innerText =
                    oldText;

            }, 1000);

        }

        catch (error) {

            alert(
                'Could not copy automatically. Select the FEN and copy it manually.'
            );

        }

    });

    /* =========================================================
   WHITE / BLACK MOVE TOGGLE
========================================================= */

document
    .getElementById('move-side-toggle')
    .addEventListener('click', () => {

        const button =
            document.getElementById('move-side-toggle');

        if (activeSide === 'w') {

            activeSide = 'b';

            button.innerText = 'BLACK MOVES';

        } else {

            activeSide = 'w';

            button.innerText = 'WHITE MOVES';

        }

        updateFEN();

    });


/* =========================================================
   CLOSE DROPDOWN WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener('click', event => {

    if (
        !event.target.closest(
            '.selector-container'
        )
    ) {

        dropdown.classList.remove('open');

        dropdownArrow.classList.remove('open');

    }

});


/* =========================================================
   INITIALIZE
========================================================= */

createEmptyBoard();

createBoardVisuals();

createPieceDropdown();

resetBoard();

</script>
