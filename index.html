    const boardSize = 16;
    let board = new Array(boardSize).fill(null).map(() => new Array(boardSize).fill(null));
    let positionStatus = "normal";
    let selectedSquare = null;
    let legalMoves = [];
    let enPassantTarget = null;
    let promotionSquare = null;

    let amazonianUnlocked = { white: false, black: false };
    let lastMovedPieceType = null; 

    const officerRow = [
        'E', 'Ch', 'Af', 'Ab', 'Ex', 'Ca', 'M', 'K', 
        'A', 'J', 'Al', 'R', 'ZN', 'Ba', 'Ch', 'E'
    ];

    const pawnRow = [
        'BP', 'BP', 'BP', 'P', 'P', 'P', 'AP', 'AP', 
        'AP', 'AP', 'P', 'P', 'P', 'BP', 'BP', 'BP'
    ];

    const promotionMap = {
        '1': 'A', '2': 'R', '3': 'Ch', '4': 'Ab', '5': 'Ba',
        '6': 'Ca', '7': 'E','8': 'Ex', '9': 'ZN', 
        'q': 'AfR', 'w': 'Af', 'e': 'Al', 'r': 'AlR', 't': 'Am', '0': 'J',
        'z': '0Q', 'x': '0R', 'c': '0N', 'v': '0P', 'b': '0B'
    };

    const longPieceNames = {
        'A': 'Amazon', 'R': 'Rose', 'Ch': 'Chancellor', 'Ab': 'Archbishop', 'Ba': 'Baronet',
        'Ca': 'Castle', 'E': 'Elephant', '0B': 'Bishop (Original)', 'Ex': 'Executioner', 'ZN': 'Zigzag Nightrider',
        'AfR': 'Alfilrider', 'Af': 'Alfil', 'Al': 'Alibaba', 'AlR': 'Alibabarider', 'Am': 'Amazonian', 'J': 'Jester',
        'M': 'Mortar', '0Q': 'Queen (Original)', '0R': 'Rook (Original)', '0N': 'Knight (Original)', '0P': 'Pawn (Original)'
    };

    function setupBoard() {
        for (let col = 0; col < boardSize; col++) {
            board[0][col] = { type: officerRow[col], color: 'black', moves: 0 };
            board[15][col] = { type: officerRow[col], color: 'white', moves: 0 };

            board[1][col] = { type: pawnRow[col], color: 'black', moves: 0 };
            board[14][col] = { type: pawnRow[col], color: 'white', moves: 0 };
        }
    }

    function findKing(color) {
        for (let r = 0; r < boardSize; r++) {
            for (let c = 0; c < boardSize; c++) {
                if (board[r][c] && board[r][c].type === 'K' && board[r][c].color === color) {
                    return { row: r, col: c };
                }
            }
        }
        return null;
    }

    function isSquareAttacked(targetRow, targetCol, attackerColor) {
        for (let r = 0; r < boardSize; r++) {
            for (let c = 0; c < boardSize; c++) {
                if (board[r][c] && board[r][c].color === attackerColor) {
                    if (typeof getPseudoLegalMoves !== 'function') return false;
                    const attackMoves = getPseudoLegalMoves(r, c);
for (let move of attackMoves) {

    // Normal movement attacks
    if (move.row === targetRow && move.col === targetCol) {
        return true;
    }

    // Arrow Pawn ranged attacks
    if (
        move.isArrowShoot &&
        move.targetRow === targetRow &&
        move.targetCol === targetCol
    ) {
        return true;
    }

    // Mortar shell attacks
    if (
        move.isMortarShot &&
        move.targetRow === targetRow &&
        move.targetCol === targetCol
    ) {
        return true;
    }
}
                }
            }
        }
        return false;
    }

    function isKingInCheck(color) {
        const kingPos = findKing(color);
        if (!kingPos) return false;
        const enemyColor = color === 'white' ? 'black' : 'white';
        return isSquareAttacked(kingPos.row, kingPos.col, enemyColor);
    }

    function getStrictlyLegalMoves(r, c) {
        const piece = board[r][c];
        if (!piece || typeof getPseudoLegalMoves !== 'function') return [];

        const pseudoMoves = getPseudoLegalMoves(r, c);
        let validMoves = [];

        for (let move of pseudoMoves) {
            const originalSource = board[r][c];
            const originalTarget = board[move.row][move.col];
            let originalArrowTarget = null;

            if (move.isArrowShoot) {
                originalArrowTarget = board[move.targetRow][move.targetCol];
                board[move.targetRow][move.targetCol] = null;
            }
            board[move.row][move.col] = originalSource;
            board[r][c] = null;

            if (!isKingInCheck(piece.color)) {
                validMoves.push(move);
            }

            board[r][c] = originalSource;
            board[move.row][move.col] = originalTarget;
            if (move.isArrowShoot) {
                board[move.targetRow][move.targetCol] = originalArrowTarget;
            }
        }
        return validMoves;
    }

    function scanGameEndConditions(playerColor) {
        let totalLegalMoves = 0;

        for (let r = 0; r < boardSize; r++) {
            for (let c = 0; c < boardSize; c++) {
                if (board[r][c] && board[r][c].color === playerColor) {
                    totalLegalMoves += getStrictlyLegalMoves(r, c).length;
                }
            }
        }   

    const inCheck = isKingInCheck(playerColor);

if (totalLegalMoves === 0) {
    if (inCheck) {
        positionStatus = "inmate";

        playCheckmateSound();

        setTimeout(() => alert(`🚨 CHECKMATE! Game Over.`), 150);
    } else {
        positionStatus = "instale";

        playStalemateSound();

        setTimeout(() => alert(`⚖️ STALEMATE!`), 150);
    }
} else if (inCheck) {
    positionStatus = "incheck";

    playCheckSound();

} else {
    positionStatus = "normal";
}
}

function appendStatusToLastMove() {
    if (moveHistoryLog.length === 0) return;

    const lastIndex = moveHistoryLog.length - 1;
    let activeLine = moveHistoryLog[lastIndex];

    let suffix = "";

    if (positionStatus === "incheck") {
        suffix = "+";
    } else if (positionStatus === "inmate") {
        suffix = "#";
    } else if (positionStatus === "instale") {
        suffix = "%";
    }

    if (suffix) {
        const placeholderIndex = activeLine.indexOf(" --XX--");

        if (placeholderIndex !== -1) {
            activeLine =
                activeLine.slice(0, placeholderIndex) +
                suffix +
                activeLine.slice(placeholderIndex);
        } else {
            activeLine += suffix;
        }

        moveHistoryLog[lastIndex] = activeLine;
    }

    updateNotationConsoleUI();
}

const boardSquares = [];

function initializeBoardVisuals() {
    const boardDiv = document.getElementById('board');
    if (!boardDiv || boardSquares.length > 0) return;

    const letters = "abcdefghijklmnop";

    for (let row = 0; row < boardSize; row++) {
        boardSquares[row] = [];

        for (let col = 0; col < boardSize; col++) {
            const square = document.createElement('div');

            square.className =
                `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;

            square.dataset.row = row;
            square.dataset.col = col;

            if (col === 0) {
                const numLabel = document.createElement('span');
                numLabel.className = 'coord-label coord-number';
                numLabel.innerText = boardSize - row;
                square.appendChild(numLabel);
            }

            if (row === boardSize - 1) {
                const letLabel = document.createElement('span');
                letLabel.className = 'coord-label coord-letter';
                letLabel.innerText = letters[col];
                square.appendChild(letLabel);
            }

            square.addEventListener('click', () => {
                handleSquareClick(row, col);
            });

            boardDiv.appendChild(square);
            boardSquares[row][col] = square;
        }
    }
}

function drawBoard() {
    const boardDiv = document.getElementById('board');
    if (!boardDiv) return;

    initializeBoardVisuals();

    const statusSpan = document.getElementById('mimic-status');

    if (statusSpan) {
        statusSpan.innerText =
            lastMovedPieceType
                ? `${longPieceNames[lastMovedPieceType] || lastMovedPieceType} (${lastMovedPieceType})`
                : "None (King Fallback)";
    }

    const whiteInCheck = isKingInCheck('white');
    const blackInCheck = isKingInCheck('black');

    for (let row = 0; row < boardSize; row++) {
        for (let col = 0; col < boardSize; col++) {

            const square = boardSquares[row][col];

            square.classList.remove(
                'selected',
                'legal-move',
                'capture-move'
            );

            square.style.backgroundColor = '';

            if (
                selectedSquare &&
                selectedSquare.row === row &&
                selectedSquare.col === col
            ) {
                square.classList.add('selected');
            }

            const legalMove = legalMoves.find(m => {

                if (m.isMortarShot) {
                    return (
                        m.targetRow === row &&
                        m.targetCol === col
                    );
                }

                return (
                    m.row === row &&
                    m.col === col
                );
            });

            if (legalMove) {
                if (legalMove.isCapture) {
                    square.classList.add('capture-move');
                } else {
                    square.classList.add('legal-move');
                }
            }

            const piece = board[row][col];

            let pieceElement = square.querySelector(
                '.piece-icon, .piece'
            );

            if (!piece) {

                if (pieceElement) {
                    pieceElement.remove();
                }

                square.dataset.pieceKey = '';

            } else {

                const colorPrefix =
                    piece.color === 'white' ? 'W' : 'B';

                const pieceKey =
                    `${colorPrefix}_${piece.type}`;

                if (square.dataset.pieceKey !== pieceKey) {

                    if (pieceElement) {
                        pieceElement.remove();
                    }

                    const pieceImg =
                        document.createElement('img');

                    pieceImg.src =
                        `pieces/${colorPrefix}_${piece.type}.png`;

                    pieceImg.className =
                        'piece-icon';

                    pieceImg.alt =
                        `${piece.color} ${piece.type}`;

                    pieceImg.draggable = false;

                    pieceImg.onerror = function () {

                        if (
                            this.dataset.fallbackApplied === 'true'
                        ) {
                            return;
                        }

                        this.dataset.fallbackApplied = 'true';

                        const fallbackSpan =
                            document.createElement('span');

                        fallbackSpan.className =
                            `piece ${piece.color}-piece`;

                        fallbackSpan.innerText =
                            piece.type;

                        this.replaceWith(fallbackSpan);
                    };

                    square.appendChild(pieceImg);

                    square.dataset.pieceKey = pieceKey;
                }
            }

            if (piece && piece.type === 'K') {

                if (
                    (piece.color === 'white' && whiteInCheck) ||
                    (piece.color === 'black' && blackInCheck)
                ) {
                    square.style.backgroundColor = '#8b0000';
                }
            }
        }
    }
}
